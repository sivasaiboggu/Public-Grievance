services:
  redis:
    image: redis:7-alpine
    container_name: grievancegrid-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    restart: unless-stopped

  postgres:
    image: postgres:17-alpine
    container_name: grievancegrid-postgres
    environment:
      POSTGRES_DB: grievancegrid
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 3s
      retries: 5
    restart: unless-stopped

  mailpit:
    image: axllent/mailpit:latest
    container_name: grievancegrid-mailpit
    ports:
      - "1025:1025" # SMTP port
      - "8025:8025" # Web UI
    restart: unless-stopped

volumes:
  redis_data:
  postgres_data:
